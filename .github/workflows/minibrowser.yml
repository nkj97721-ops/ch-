name: MiniBrowser APK
on:
  push:
    branches: [ minibrowser-11020328 ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MiniBrowser11020328
    steps:
      - uses: actions/checkout@v4
        with:
          ref: minibrowser-11020328
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: minibrowser-11020410-apk
          path: MiniBrowser11020328/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
